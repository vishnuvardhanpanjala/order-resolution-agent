name: ci
on: [push, pull_request]
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests (policy, controls, verifier, pipeline, Groq client against a fake server)
        run: python -m pytest -q
      - name: Evals with hard gates (replays recorded model calls, no API key needed)
        run: python -m evals.run_evals --mode auto --quiet
